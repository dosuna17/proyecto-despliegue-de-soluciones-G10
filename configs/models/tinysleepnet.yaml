# Hiperparametros de TinySleepNet (version base v0.1.0).
# Valores copiados del codigo vigente, sin cambiar ninguno.
# input_channels y class_weights no van aqui: salen de los datos.

seed: 42

data:
  seq_length: 15
  batch_size: 20
  max_epochs_per_recording: 500
  val_fraction: 0.15

training:
  learning_rate: 0.0001
  adam_betas: [0.9, 0.999]
  grad_clip_norm: 5.0
  cv:
    max_epochs: 20
    early_stopping_patience: 5
  final:
    max_epochs: 100
    early_stopping_patience: 15
    checkpoint_every_n_epochs: 5

model:
  sampling_rate: 100
  input_size: 3000
  n_classes: 5
  cnn_filters: 128
  cnn_dropout: 0.5
  use_rnn: true
  n_rnn_layers: 1
  n_rnn_units: 128
  rnn_dropout: 0.5
  seq_length: 15
  l2_weight_decay: 0.001
