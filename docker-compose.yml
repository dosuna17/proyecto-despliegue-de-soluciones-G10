services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sleep-staging-api
    # La API solo la usa el tablero: no se publica a Internet. Para probarla
    # desde la propia instancia: curl http://localhost:8000/health
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MLFLOW_HTTP_REQUEST_TIMEOUT: ${MLFLOW_HTTP_REQUEST_TIMEOUT:-15}
      MLFLOW_ARTIFACT_PATH: ${MLFLOW_ARTIFACT_PATH:-modelo_final/flexible_emg_mlp_final.pth}
      MODEL_USE_MLFLOW: ${MODEL_USE_MLFLOW:-false}
      MODEL_PATH: ${MODEL_PATH:-/models/flexible_final.pth}
    volumes:
      - ${MODEL_DIR:-./modelos}:${MODEL_MOUNT_PATH:-/models}:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: app/dashboard/Dockerfile
    container_name: sleep-staging-dashboard
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker la API se llama "api".
      SLEEP_STAGING_API_URL: http://api:8000
      # Opcionales (si no se definen se usa configs/app.yaml):
      TABLERO_UMBRALES_CONFIANZA: ${TABLERO_UMBRALES_CONFIANZA:-}
      TABLERO_SOLICITUDES_PARALELAS: ${TABLERO_SOLICITUDES_PARALELAS:-}
      TABLERO_SECUENCIAS_POR_SOLICITUD: ${TABLERO_SECUENCIAS_POR_SOLICITUD:-}
      TABLERO_TIMEOUT_INFERENCIA_S: ${TABLERO_TIMEOUT_INFERENCIA_S:-}
